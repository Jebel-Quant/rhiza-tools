[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:-(?P<release>[a-z]+)\\.(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = ["{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}", "{major}.{minor}.{patch}+build.{build_n}", "{major}.{minor}.{patch}-{release}.{pre_n}", "{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Chore: bump version {current_version} → {new_version}"
commit_args = ""

[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
    "dev",
    "alpha",
    "beta",
    "rc",
    "prod"
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.coverage-badge]
# Path to coverage.json file (relative to project root)
coverage_json = "_tests/coverage.json"
# Output directory for the badge JSON file
output_dir = "_book/tests"
# Badge filename
badge_filename = "coverage-badge.json"

# Color thresholds: percentage -> color
# Badge color is determined by finding the highest threshold the coverage meets
[tool.coverage-badge.thresholds]
90 = "brightgreen"
80 = "green"
70 = "yellowgreen"
60 = "yellow"
50 = "orange"
0 = "red"