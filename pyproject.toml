[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhiza-tools"
version = "0.2.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "questionary>=2.1.1",
    "semver>=3.0.4",
    "tomlkit>=0.13.3",
    "typer>=0.9.0",
    "bump-my-version==1.2.6",
]

[dependency-groups]
dev = [
    "marimo>=0.18.0,<1.0",   # Reactive notebook runtime for book/ examples
    "numpy>=2.4.0,<3.0",     # Numerical computing for notebook data analysis
    "plotly>=6.5.0,<7.0",    # Interactive visualization in notebooks
    "pandas>=3,<3.1",        # Data manipulation for notebook examples
]

[project.scripts]
rhiza-tools = "rhiza_tools.__main__:app"

[project.entry-points."rhiza.plugins"]
tools = "rhiza_tools.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rhiza_tools"]

[tool.deptry.package_module_name_map]
"bump-my-version" = "bumpversion"
"loguru" = "loguru"
"marimo" = "marimo"
"numpy" = "numpy"
"pandas" = "pandas"
"plotly" = "plotly"
"questionary" = "questionary"
"semver" = "semver"
"tomlkit" = "tomlkit"
"typer" = "typer"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true

