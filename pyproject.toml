[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhiza-tools"
version = "0.7.3"
description = "Extra utilities and tools for the Rhiza ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
authors = [
    {name = "Thomas Schmelzer", email = "thomas.s@yukkalab.com"},
]

dependencies = [
    "loguru>=0.7.3,<0.8",
    "questionary>=2.1.1,<3.0",
    "semver>=3.0.4,<4.0",
    "tomlkit>=0.13.3,<1.0",
    "typer>=0.16.0,<1.0",
    "bump-my-version>=1.3.0,<1.4",   # patch-floating: pick up 1.3.x fixes, hold the minor we test against
    # pandas + plotly back only the optional `analyze-benchmarks` visualization
    # command, where they are imported lazily (see commands/analyze_benchmarks.py).
    # The >=3 floor is the version pinned at introduction, not a code requirement
    # (only DataFrame/sort_values/to_string are used); <3.1 holds the tested minor.
    "pandas>=3,<3.1",
    "plotly>=6.5.0,<7.0",
    "prompt-toolkit>=3.0.52,<4.0",
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/rhiza-tools"
Repository = "https://github.com/Jebel-Quant/rhiza-tools"

[dependency-groups]
dev = [
    "marimo>=0.18.0,<1.0",   # Reactive notebook runtime for book/ examples
    "numpy>=2.4.0,<3.0",     # Numerical computing for notebook data analysis
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.150.0",
    "mutmut>=2.4,<3",   # mutation testing (`make mutation`); 2.x matches the run-flags the target uses
]
lint = [
    "ruff>=0.1.0",
]

[project.scripts]
rhiza-tools = "rhiza_tools.__main__:app"

[project.entry-points."rhiza.plugins"]
tools = "rhiza_tools.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rhiza_tools"]

[tool.ty.terminal]
# Strict type-checking gate: any ty warning fails `make typecheck` / CI, not just
# hard errors. Keeps the type surface honest as the code evolves.
error-on-warning = true

# `make typecheck` runs `mypy --strict` alongside ty (strictness comes from the
# CLI flag, so this global table only needs to exist for mypy to read the
# per-module overrides below from pyproject.toml).
[tool.mypy]

# These third-party dependencies ship no type information (no stubs published,
# no py.typed marker), so strict mode would fail on `import-untyped` for every
# import. Ignore their missing imports here — centralized and rationalized —
# rather than scattering per-line `type: ignore`s; mypy still type-checks our
# own use of their values.
[[tool.mypy.overrides]]
module = [
    "bumpversion.*",  # bump-my-version: no published stubs
    "pandas.*",       # pandas-stubs not a runtime dep; benchmark analysis only
    "plotly.*",       # plotly: no py.typed marker
]
ignore_missing_imports = true

[tool.deptry.package_module_name_map]
"bump-my-version" = "bumpversion"
"hypothesis" = "hypothesis"
"loguru" = "loguru"
"marimo" = "marimo"
"mutmut" = "mutmut"
"numpy" = "numpy"
"pandas" = "pandas"
"plotly" = "plotly"
"prompt-toolkit" = "prompt_toolkit"
"pytest" = "pytest"
"pytest-cov" = "pytest_cov"
"pytest-mock" = "pytest_mock"
"pytest-timeout" = "pytest_timeout"
"pytest-xdist" = "xdist"   # plugin imports as `xdist`, not `pytest_xdist`
"questionary" = "questionary"
"ruff" = "ruff"
"semver" = "semver"
"tomlkit" = "tomlkit"
"typer" = "typer"

