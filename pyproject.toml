[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhiza-tools"
version = "0.8.1"
description = "CI helper CLI for the Rhiza ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
authors = [
    {name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"},
]

dependencies = [
    "packaging>=24.0",   # semver ordering of Python-version classifiers (version-matrix)
    "typer>=0.16.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/rhiza-tools"
Repository = "https://github.com/Jebel-Quant/rhiza-tools"

[dependency-groups]
dev = [
    "marimo>=0.18.0,<1.0",   # Reactive notebook runtime for book/ examples
    "numpy>=2.4.0,<3.0",     # Numerical computing for notebook data analysis
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.150.0",
    "mutmut>=2.4,<3",   # mutation testing (`make mutation`); 2.x matches the run-flags the target uses
]
lint = [
    "ruff>=0.1.0",
]

[project.scripts]
rhiza-tools = "rhiza_tools.__main__:app"

[project.entry-points."rhiza.plugins"]
tools = "rhiza_tools.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rhiza_tools"]

[tool.ty.terminal]
# Strict type-checking gate: any ty warning fails `make typecheck` / CI, not just
# hard errors. Keeps the type surface honest as the code evolves.
error-on-warning = true

[tool.deptry.package_module_name_map]
"hypothesis" = "hypothesis"
"marimo" = "marimo"
"mutmut" = "mutmut"
"numpy" = "numpy"
"packaging" = "packaging"
"pytest" = "pytest"
"pytest-cov" = "pytest_cov"
"pytest-mock" = "pytest_mock"
"pytest-timeout" = "pytest_timeout"
"pytest-xdist" = "xdist"   # plugin imports as `xdist`, not `pytest_xdist`
"ruff" = "ruff"
"typer" = "typer"

