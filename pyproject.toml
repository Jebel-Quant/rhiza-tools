[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhiza-tools"
version = "0.5.2"
description = "Extra utilities and tools for the Rhiza ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
authors = [
    {name = "Thomas Schmelzer", email = "thomas.s@yukkalab.com"},
]

dependencies = [
    "loguru>=0.7.3",
    "questionary>=2.1.1",
    "semver>=3.0.4",
    "tomlkit>=0.13.3",
    "typer>=0.16.0",
    "bump-my-version==1.3.0",
    "pandas>=3,<3.1",
    "plotly>=6.5.0,<7.0",
    "prompt-toolkit>=3.0.52",
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/rhiza-tools"
Repository = "https://github.com/Jebel-Quant/rhiza-tools"

[dependency-groups]
dev = [
    "marimo>=0.18.0,<1.0",   # Reactive notebook runtime for book/ examples
    "numpy>=2.4.0,<3.0",     # Numerical computing for notebook data analysis
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.150.0",
]
lint = [
    "ruff>=0.1.0",
]

[project.scripts]
rhiza-tools = "rhiza_tools.__main__:app"

[project.entry-points."rhiza.plugins"]
tools = "rhiza_tools.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rhiza_tools"]

[tool.deptry.package_module_name_map]
"bump-my-version" = "bumpversion"
"loguru" = "loguru"
"marimo" = "marimo"
"numpy" = "numpy"
"pandas" = "pandas"
"plotly" = "plotly"
"questionary" = "questionary"
"semver" = "semver"
"tomlkit" = "tomlkit"
"typer" = "typer"

